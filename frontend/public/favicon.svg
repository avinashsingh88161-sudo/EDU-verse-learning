<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    
    <!-- Subtle Inner Glow -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <!-- Modern Rounded Icon Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Graduation Cap (Mortarboard) Diamond Top -->
  <path d="M32 14L10 24L32 34L54 24L32 14Z" fill="url(#capGrad)" stroke="#ffffff" stroke-width="0.5" stroke-linejoin="round" />

  <!-- Cap Skull Base / Band -->
  <path d="M19 28.5V37C19 37 23.5 42 32 42C40.5 42 45 37 45 37V28.5L32 34.5L19 28.5Z" fill="#e0e7ff" fill-opacity="0.9" />

  <!-- Graduation Tassel Hanging String & Charm -->
  <path d="M47 26.5V36.5C47 38 48.5 39 49.5 39" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="49.5" cy="40.5" r="2" fill="url(#goldGrad)" />
  <circle cx="32" cy="24" r="1.8" fill="url(#goldGrad)" />

  <!-- Open Book / Learning Pages Base -->
  <path d="M16 48C21 45.5 27 45.5 32 48.5C37 45.5 43 45.5 48 48V51.5C43 49 37 49 32 52C27 49 21 49 16 51.5V48Z" fill="#ffffff" />
  <line x1="32" y1="48.5" x2="32" y2="52" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round" />
</svg>